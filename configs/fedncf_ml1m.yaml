# Confirmatory (an HPC cluster, full data, 5 seeds): federated GMF (FedNCF) on full ML-1M.
# Adds FRU + ours (need the federated contribution logs). Cross-DEVICE regime (many clients).
# For the ours-advantage cross-SILO ablation, also run configs/phase1_fedncf_silo.yaml at scale.
sweep_id: fedncf_ml1m
backbone: fedncf
# Full ML-1M, cross-device federation. The simulator is vectorized (~9 s/retrain on full data,
# was ~16.5 min), so full scale is cheap: ~3000 units x ~9 s ~= 8 CPU-h -> ~1 h/shard at N=8.
dataset: ml1m
n_users: 0             # full ML-1M (6040 clients)
data_seed: 0
dim: 32
fed_rounds: 30
fed_local_epochs: 3
fed_lr: 0.2
seeds: [0, 1, 2, 3, 4]
per_stratum: 60
n_controls: 50
methods: [retrain, naive_delete, gradient_ascent, fru, ours]
